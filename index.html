    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .header {
            position: absolute;
            z-index: 10;
            top: 20px;
            left: 20px;
            padding: 14px 18px;
            background: rgba(20, 25, 35, 0.88);
            color: white;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 25px rgba(0,0,0,.25);
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .header p {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: .7;
        }
        .panel {
            position: absolute;
            z-index: 10;
            top: 20px;
            right: 20px;
            width: 230px;
            padding: 16px;
            background: rgba(20, 25, 35, .88);
            color: white;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 25px rgba(0,0,0,.25);
        }
        .panel h2 {
            margin: 0 0 12px;
            font-size: 14px;
        }
        .filter {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            font-size: 13px;
            cursor: pointer;
        }
        .filter input {
            cursor: pointer;
        }
        .site-info {
            position: absolute;
            z-index: 20;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            min-width: 300px;
            max-width: 450px;
            padding: 18px;
            background: rgba(20, 25, 35, .94);
            color: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.35);
            display: none;
        }
        .site-info h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }
        .site-info p {
            margin: 5px 0;
            font-size: 13px;
            opacity: .85;
        }
        .close {
            position: absolute;
            top: 8px;
            right: 10px;
            border: none;
            background: transparent;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        /* Hide Cesium logo if desired */
        .cesium-viewer-bottom {
            display: none;
        }
    </style>
    <script src="./assets/data/sites.js"></script>
</head>

    /* ============================================================
       CLICK HANDLER
    ============================================================ */

    const handler =
        new Cesium.ScreenSpaceEventHandler(
            viewer.scene.canvas
        );

    handler.setInputAction(
        function(click) {
            rpSlideshow.nextFrame();
            const picked =
                viewer.scene.pick(click.position);
            if (
                !Cesium.defined(picked) ||
                !picked.id
            ) {
                return;
            }
            const entity = picked.id;
            if (!entity.properties) {
                return;
            }
            
            //showSiteInfo(entity);
        },
        Cesium.ScreenSpaceEventType.LEFT_CLICK
    );
